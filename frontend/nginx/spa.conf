# Production image only (Dockerfile target "prod"): serve the built PWA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css image/svg+xml application/manifest+json;

    # Hashed bundles never change: cache for a year on the phone.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and shell must be revalidated so updates reach users.
    location ~* ^/(sw\.js|workbox-.*\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Deep links (/article/riz) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
